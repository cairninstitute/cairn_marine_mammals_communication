name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (CPU-only torch, no optional extras)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"

      - name: Lint
        run: ruff check src scripts tests

      - name: Syntax-check all scripts
        run: python -m compileall -q src scripts

      - name: Unit tests
        run: pytest

      - name: End-to-end train.py on toy config
        run: pytest -m slow
