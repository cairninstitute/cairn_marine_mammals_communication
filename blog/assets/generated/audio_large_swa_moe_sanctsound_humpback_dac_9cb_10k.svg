<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1160" role="img" aria-labelledby="title desc">
<title id="title">MMC causal decoder · audio large swa moe sanctsound humpback dac 9cb 10k</title>
<desc id="desc">16-layer causal transformer. 10,240 tokens · 9-codebook interleaved audio. aux-loss balanced MoE · top 2 of 8 experts.</desc>
