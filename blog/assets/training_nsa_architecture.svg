<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Native Sparse Attention architecture</title><desc id="desc">Twelve transformer layers: layers 5 and 10 attend causally over key and value anchors sampled every 72 tokens across the complete 128K context. All other layers use a causal 2,048-token local window. Each layer routes tokens to one of sixteen experts.</desc>
<style>text{font-family:Inter,Arial,sans-serif;fill:#15283b}.t{font-size:31px;font-weight:700}.s{font-size:16px;fill:#486174}.h{font-size:14px;font-weight:700;letter-spacing:1px;fill:#486174}.l{font-size:14px;font-weight:700;text-anchor:middle}.d{font-size:12px;fill:#486174;text-anchor:middle}</style>
<rect width="1200" height="720" fill="#fbfdff"/><rect x="22" y="22" width="1156" height="676" rx="18" fill="#fff" stroke="#d7e3ec" stroke-width="2"/>
<text x="62" y="76" class="t">NSA + MoE: compressed global context</text><text x="62" y="105" class="s">Medium 9CB model · 12 transformer layers · 131,072-token (128K) context</text>
<rect x="62" y="138" width="1076" height="142" rx="13" fill="#f3f8fb" stroke="#d7e3ec"/><text x="88" y="170" class="h">WHAT ONE COMPRESSED-GLOBAL LAYER SEES</text><text x="88" y="201" font-size="15" font-weight="700">Full-resolution queries; K/V sampled every 72 tokens across the complete sequence</text><line x1="88" y1="229" x2="1092" y2="229" stroke="#9ab1c1" stroke-width="3"/><g fill="#376fa7"><circle cx="92" cy="229" r="7"/><circle cx="148" cy="229" r="7"/><circle cx="204" cy="229" r="7"/><circle cx="260" cy="229" r="7"/><circle cx="316" cy="229" r="7"/><circle cx="372" cy="229" r="7"/><circle cx="428" cy="229" r="7"/><circle cx="484" cy="229" r="7"/><circle cx="540" cy="229" r="7"/><circle cx="596" cy="229" r="7"/><circle cx="652" cy="229" r="7"/><circle cx="708" cy="229" r="7"/><circle cx="764" cy="229" r="7"/><circle cx="820" cy="229" r="7"/><circle cx="876" cy="229" r="7"/><circle cx="932" cy="229" r="7"/><circle cx="988" cy="229" r="7"/><circle cx="1044" cy="229" r="7"/><circle cx="1092" cy="229" r="7"/></g><text x="88" y="261" class="s" font-size="13">≈1,820 K/V anchors at 128K · causal masking excludes anchors after each query position</text>
<text x="62" y="320" class="h">ATTENTION SCHEDULE — BOTTOM TO TOP</text><text x="62" y="345" class="s" font-size="13">Global layers use strided-compressed K/V, not dense full attention.</text>
<g transform="translate(62,370)"><g fill="#e8f6f1" stroke="#58b89a" stroke-width="2"><rect width="82" height="82" rx="10"/><rect x="90" width="82" height="82" rx="10"/><rect x="180" width="82" height="82" rx="10"/><rect x="270" width="82" height="82" rx="10"/><rect x="542" width="82" height="82" rx="10"/><rect x="632" width="82" height="82" rx="10"/><rect x="722" width="82" height="82" rx="10"/><rect x="812" width="82" height="82" rx="10"/><rect y="92" width="82" height="82" rx="10"/><rect x="90" y="92" width="82" height="82" rx="10"/></g><g fill="#eaf1fb" stroke="#376fa7" stroke-width="2.5"><rect x="360" width="174" height="82" rx="10"/><rect x="902" width="174" height="82" rx="10"/></g><g class="l"><text x="41" y="29">L1</text><text x="131" y="29">L2</text><text x="221" y="29">L3</text><text x="311" y="29">L4</text><text x="447" y="29">L5</text><text x="583" y="29">L6</text><text x="673" y="29">L7</text><text x="763" y="29">L8</text><text x="853" y="29">L9</text><text x="989" y="29">L10</text><text x="41" y="121">L11</text><text x="131" y="121">L12</text></g><g class="d"><text x="41" y="54">local SWA</text><text x="131" y="54">local SWA</text><text x="221" y="54">local SWA</text><text x="311" y="54">local SWA</text><text x="447" y="54">compressed global</text><text x="447" y="71">stride-72 K/V</text><text x="583" y="54">local SWA</text><text x="673" y="54">local SWA</text><text x="763" y="54">local SWA</text><text x="853" y="54">local SWA</text><text x="989" y="54">compressed global</text><text x="989" y="71">stride-72 K/V</text><text x="41" y="146">local SWA</text><text x="131" y="146">local SWA</text></g></g>
<rect x="62" y="576" width="1076" height="78" rx="13" fill="#f5f2fc" stroke="#dcd3f0"/><text x="88" y="610" class="h">FEED-FORWARD PATH IN EVERY LAYER</text><text x="88" y="639" font-size="16" font-weight="700">Bias-routed MoE: each token selects top 1 of 16 experts</text>
</svg>
