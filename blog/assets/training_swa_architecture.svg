<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Sliding Window Attention architecture</title><desc id="desc">Sixteen transformer layers: layers 5, 10, and 15 use full causal attention. The other layers use a causal 1,024-token local window. Each layer uses top-2 routing across eight experts.</desc>
<style>text{font-family:Inter,Arial,sans-serif;fill:#15283b}.t{font-size:31px;font-weight:700}.s{font-size:16px;fill:#486174}.h{font-size:14px;font-weight:700;letter-spacing:1px;fill:#486174}.l{font-size:14px;font-weight:700;text-anchor:middle}.d{font-size:12px;fill:#486174;text-anchor:middle}</style>
<rect width="1200" height="720" fill="#fbfdff"/><rect x="22" y="22" width="1156" height="676" rx="18" fill="#fff" stroke="#d7e3ec" stroke-width="2"/>
<text x="62" y="76" class="t">SWA + MoE: periodic full-context refresh</text><text x="62" y="105" class="s">Large 9CB model · 16 transformer layers · 10,240-token context</text>
<rect x="62" y="138" width="1076" height="115" rx="13" fill="#f3f8fb" stroke="#d7e3ec"/><text x="88" y="170" class="h">WHAT ONE LOCAL-ATTENTION LAYER SEES</text><text x="88" y="202" font-size="15" font-weight="700">Query position t</text><line x1="88" y1="224" x2="1090" y2="224" stroke="#9ab1c1" stroke-width="3"/><rect x="682" y="212" width="304" height="24" rx="12" fill="#58b89a"/><line x1="986" y1="195" x2="986" y2="241" stroke="#dc6b55" stroke-width="4"/><text x="682" y="246" class="s" font-size="13">causal local window: previous 1,024 tokens through t</text><text x="996" y="203" class="s" font-size="13">t</text>
<text x="62" y="294" class="h">ATTENTION SCHEDULE — BOTTOM TO TOP</text><text x="62" y="319" class="s" font-size="13">Full-attention layers directly connect the complete causal history; all other layers operate locally.</text>
<g transform="translate(62,344)">
<g fill="#e8f6f1" stroke="#58b89a" stroke-width="2"><rect width="104" height="82" rx="10"/><rect x="112" width="104" height="82" rx="10"/><rect x="224" width="104" height="82" rx="10"/><rect x="336" width="104" height="82" rx="10"/><rect x="560" width="104" height="82" rx="10"/><rect x="672" width="104" height="82" rx="10"/><rect x="784" width="104" height="82" rx="10"/><rect x="896" width="104" height="82" rx="10"/><rect y="92" width="104" height="82" rx="10"/><rect x="112" y="92" width="104" height="82" rx="10"/><rect x="224" y="92" width="104" height="82" rx="10"/><rect x="336" y="92" width="104" height="82" rx="10"/><rect x="560" y="92" width="104" height="82" rx="10"/></g>
<g fill="#fff0e9" stroke="#dc6b55" stroke-width="2.5"><rect x="448" width="104" height="82" rx="10"/><rect x="1008" width="104" height="82" rx="10"/><rect x="448" y="92" width="104" height="82" rx="10"/></g>
<g class="l"><text x="52" y="29">L1</text><text x="164" y="29">L2</text><text x="276" y="29">L3</text><text x="388" y="29">L4</text><text x="500" y="29">L5</text><text x="612" y="29">L6</text><text x="724" y="29">L7</text><text x="836" y="29">L8</text><text x="948" y="29">L9</text><text x="1060" y="29">L10</text><text x="52" y="121">L11</text><text x="164" y="121">L12</text><text x="276" y="121">L13</text><text x="388" y="121">L14</text><text x="500" y="121">L15</text><text x="612" y="121">L16</text></g>
<g class="d"><text x="52" y="54">local SWA</text><text x="164" y="54">local SWA</text><text x="276" y="54">local SWA</text><text x="388" y="54">local SWA</text><text x="500" y="54">full causal</text><text x="612" y="54">local SWA</text><text x="724" y="54">local SWA</text><text x="836" y="54">local SWA</text><text x="948" y="54">local SWA</text><text x="1060" y="54">full causal</text><text x="52" y="146">local SWA</text><text x="164" y="146">local SWA</text><text x="276" y="146">local SWA</text><text x="388" y="146">local SWA</text><text x="500" y="146">full causal</text><text x="612" y="146">local SWA</text></g></g>
<rect x="62" y="552" width="1076" height="102" rx="13" fill="#f5f2fc" stroke="#dcd3f0"/><text x="88" y="587" class="h">FEED-FORWARD PATH IN EVERY LAYER</text><text x="88" y="618" font-size="16" font-weight="700">MoE router: each token selects top 2 of 8 experts</text><text x="88" y="641" class="s" font-size="13">Expert width: 1,024. This routing is independent of whether the layer uses local or full attention.</text>
</svg>
