# Audio: Medium SWA+MoE — SanctSound humpback, DAC 9CB, 32K context
#
# Release architecture: 12 decoder layers with 1,024-token sliding-window
# attention and a full-attention refresh every fifth layer. Every FFN is a
# top-2 MoE over eight SwiGLU experts.
#
# Context: 32,768 tokens = ~42.3 seconds of 9-codebook interleaved DAC audio.

model:
  preset: medium_swa_moe
  vocab_size: 9219          # 9×1024 + PAD(0) + offset(+1) + SEP(9218)
  max_seq_len: 32768
  dropout: 0.1
  swa_window_size: 1024
  full_attention_every_n: 5
  n_experts: 8
  moe_top_k: 2
  expert_d_ff: 768
  moe_aux_weight: 0.01

data:
  dataset_type: audio
  token_dir: data/tokenized/sanctsound_humpback_dac
  max_seq_len: 32768
  interleave_codebooks: 9
  concat: true
  sep_token: 9218
  augment: false
  score_file: data/tokenized/sanctsound_humpback_dac/chunk_scores.csv
  min_detector_score: 0.7

training:
  learning_rate: 1.0e-4
  weight_decay: 0.15
  batch_size: 1
  val_batch_size: 1
  grad_accumulation_steps: 8
  max_eval_batches: 100
  num_epochs: 100
  warmup_steps: 1000
  min_lr_ratio: 0.01
  log_interval: 50
  eval_interval: 1000
  save_interval: 2000
  patience: 50
  use_8bit_adam: true
  output_dir: runs/audio_medium_swa_moe_sanctsound_humpback_dac_9cb_32k
